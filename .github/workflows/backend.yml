name: Nexus backend build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A source-only push skips all builds, so it must not cancel an active manual
  # main candidate. Actual main builds still serialize and supersede old builds.
  group: backend-${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[source-only]') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[source-only]')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc 2.35 baseline on both architectures.
          - runner: ubuntu-22.04
            suffix: x86_64
          - runner: ubuntu-22.04-arm
            suffix: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read pinned Rust version
        run: |
          echo "BACKEND_RUST=$(node -p 'require("./build-config.json").rust')" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.BACKEND_RUST }}
      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev protobuf-compiler libdbus-1-dev dbus-daemon libglib2.0-0 tar xz-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> backend-target'
          shared-key: backend-${{ matrix.suffix }}
      - name: Check build and promotion contracts
        run: node --test scripts/ci/*.test.mjs
      - name: Build and test pinned source, package binaries and corresponding source
        env:
          XZ_OPT: '-T0'
        run: node scripts/build-backend.mjs --work "$PWD/backend-build" --output "$PWD/backend-release" --target-dir "$PWD/backend-target"
      - name: Confirm the package names this architecture
        run: ls backend-release | grep -- "-linux-${{ matrix.suffix }}.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-backend-${{ matrix.suffix }}
          path: backend-release/*
          if-no-files-found: error
          retention-days: 7

  candidate:
    # One candidate carries both architectures; promotion publishes them in one release.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-backend-*
          merge-multiple: true
          path: backend-release
      - name: Bind both architectures to exact workflow source and bytes
        run: node scripts/ci/artifact-manifest.mjs write backend backend-release
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-backend
          path: backend-release/*
          if-no-files-found: error
          retention-days: 7
